version: '3.8'

services:
  proxy_server:
    image: nginx:1.25-alpine
    container_name: proxy_server
    ports:
      - "80:8080"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - shared
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

networks:
  shared:
    external: true
